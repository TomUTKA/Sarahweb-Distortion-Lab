<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sarahweb — ASCII Generator v7</title>
  <!-- Shared theme -->
  <link rel="stylesheet" href="./lab.css" />
</head>
<body>
  <!-- Top bar matches Distortion Lab -->
  <header class="top">
    <a class="navlink" href="./index.html">⟵ Home</a>
    <h1>Sarahweb — ASCII Generator v7</h1>
    <button id="btnCam" class="btn sfx">🎥 Start Camera</button>
    <button id="btnToggle" class="btn sfx">Toggle ASCII</button>
    <audio id="clickSfx"></audio>
  </header>

  <!-- Settings block (same details/row layout) -->
  <details open>
    <summary>⚙️ Settings</summary>
    <div class="row">
      <label>Character Set
        <select id="charset">
          <option value="classic">Classic ASCII</option>
          <option value="numbers">Numbers</option>
          <option value="latin">Latin (A–Z, a–z)</option>
          <option value="binary">Binary (0/1)</option>
          <option value="cyrillic">Cyrillic</option>
          <option value="kana">Japanese Kana</option>
          <option value="braille">Braille</option>
        </select>
      </label>

      <label>Density
        <input id="density" type="number" min="2" max="16" value="8" />
      </label>

      <label>Color
        <input id="color" type="color" value="#00e1ff" />
      </label>
    </div>
  </details>

  <!-- Output & camera (styled by lab.css) -->
  <canvas id="asciiCanvas"></canvas>
  <video id="vid" autoplay playsinline muted style="display:none"></video>

  <div id="status">Waiting for camera…</div>

  <!-- ASCII logic (separate file) -->
  <script src="./ascii.js"></script>
</body>
</html>
