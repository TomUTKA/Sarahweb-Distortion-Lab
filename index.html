<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sarahweb v7 — Home</title>
  <style>
    :root {
      --bg: #0b0c10;
      --ink: #e5e7eb;
      --accent1: #06b6d4;
      --accent2: #7c3aed;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, Segoe UI, Roboto, sans-serif; overflow: hidden; }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px;
      background: linear-gradient(#0c1120cc, #0c112000);
      border-bottom: 1px solid #1c2130;
      backdrop-filter: blur(6px);
      z-index: 10;
    }

    .brand {
      font-weight: 900;
      color: #c9d1ff;
      letter-spacing: 0.5px;
      text-shadow: 0 0 6px #7c3aed88;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
      position: relative;
    }

    h1 {
      font-size: clamp(42px, 8vw, 100px);
      font-weight: 900;
      margin: 0;
      letter-spacing: 2px;
      background: linear-gradient(90deg, var(--accent2), var(--accent1));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px #06b6d455;
    }

    p {
      color: #9aa3b2;
      font-size: 16px;
      margin-top: 12px;
      margin-bottom: 40px;
    }

    .buttons {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      background: linear-gradient(90deg, var(--accent2), var(--accent1));
      color: #0b0c10;
      border: none;
      border-radius: 14px;
      padding: 16px 28px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(6,182,212,0.3);
      transition: transform 0.15s ease, filter 0.2s ease;
      text-decoration: none;
    }

    .btn:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
    }

    #ascii {
      position: absolute;
      inset: 0;
      color: #5f6df0;
      opacity: 0.1;
      font: 12px/12px ui-monospace, monospace;
      white-space: pre;
      pointer-events: none;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">Sarahweb</div>
  </header>

  <div class="wrap">
    <pre id="ascii"></pre>
    <h1>Sarahweb</h1>
    <p>Explore real-time visual distortion and ASCII experiments.</p>
    <div class="buttons">
      <a class="btn" href="./lab.html">Open Distortion Lab</a>
      <a class="btn" href="./ascii.html">Open ASCII Generator</a>
    </div>
  </div>

  <script>
    // Animated ASCII background
    const el = document.getElementById('ascii');
    const CHARS = ' .:-=+*#%@';
    function draw() {
      const w = Math.floor(window.innerWidth / 8);
      const h = Math.floor(window.innerHeight / 12);
      let out = '', t = performance.now() / 900;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const v = 0.5 + 0.5 * Math.sin(x * 0.12 + y * 0.18 + t * 2.0) * Math.cos(x * 0.08 - y * 0.12 + t * 1.3);
          const i = Math.floor(v * (CHARS.length - 1));
          out += CHARS[i];
        }
        out += '\n';
      }
      el.textContent = out;
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
