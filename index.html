<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>Sarahweb</title><style>:root{--bg:#0b0c10;--ink:#e5e7eb}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Arial;overflow:hidden}header{position:fixed;inset:0 0 auto 0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:linear-gradient(#0c1120cc,#0c112000);border-bottom:1px solid #1c2130;backdrop-filter:blur(6px);z-index:10}.brand{font-weight:900;color:#c9d1ff;letter-spacing:.5px}.nav a{color:#93c5fd;text-decoration:none}.nav a:hover{text-decoration:underline}.wrap{height:100%;display:grid;place-items:center;padding-top:30px}.card{position:relative;width:min(820px,92vw);border-radius:18px;border:1px solid #1f2536;background:radial-gradient(1000px 420px at 100% -20%,#182039 0,#0c1222 60%,#0b0c10 100%);padding:34px 26px;box-shadow:0 20px 60px rgba(0,0,0,.45), inset 0 1px 0 #1a2030;overflow:hidden}.title{font-size:clamp(42px,8vw,96px);font-weight:900;letter-spacing:1.2px;line-height:.95;text-transform:uppercase;text-shadow:-1px 0 #00e1ff88,1px 0 #ff00aa88,0 0 24px rgba(124,58,237,.35);margin:0 0 6px 0}p{color:#9aa3b2;margin:12px 0 20px;font-size:clamp(14px,2vw,16px)}.cta{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(90deg,#7c3aed 0%,#06b6d4 100%);color:#0b0c10;border:none;border-radius:14px;padding:16px 26px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;font-size:16px;cursor:pointer;box-shadow:0 8px 30px rgba(6,182,212,.35);text-decoration:none}.cta:hover{filter:brightness(1.05);transform:translateY(-1px)}#ascii{position:absolute;inset:0;border-radius:18px;pointer-events:none;opacity:.22;font:12px/12px ui-monospace,Menlo,Consolas,monospace;color:#9fb5ff;white-space:pre;overflow:hidden;padding:10px}</style></head><body><header><div class='brand'>Sarahweb</div><div class='nav'><a href='./lab.html'>Open Distortion Lab →</a></div></header><main class='wrap'><section class='card'><pre id='ascii'></pre><h1 class='title'>Sarahweb</h1><p>GPU‑powered glitches, warps, ASCII, trails — right in your browser.</p><a class='cta' href='./lab.html'>Open the Distortion Lab →</a></section></main><script>(function(){const el=document.getElementById('ascii');const CHARS=' .:-=+*#%@';function draw(){const w=Math.floor(el.clientWidth/8),h=Math.floor(el.clientHeight/12);let out='',t=performance.now()/900;for(let y=0;y<h;y++){for(let x=0;x<w;x++){const v=0.5+0.5*Math.sin(x*0.12+y*0.18+t*2.0)*Math.cos(x*0.08-y*0.12+t*1.3);const i=Math.min(CHARS.length-1,Math.max(0,Math.floor(v*(CHARS.length))));out+=CHARS[i];}out+='\n';}el.textContent=out;requestAnimationFrame(draw);}draw();})();</script></body></html>
