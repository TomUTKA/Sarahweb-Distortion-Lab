<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sarahweb — Distortion Lab v7</title>
  <link rel="stylesheet" href="./lab.css" />
</head>
<body>
  <header class="top">
    <a class="navlink" href="./index.html">⟵ Home</a>
    <h1>Sarahweb — Distortion Lab v7</h1>
    <button id="btnCam" class="btn sfx">Start Camera</button>
    <button id="btnRandom" class="btn sfx">🎲 Randomize</button>
    <button id="btnShuffle" class="btn sfx">🔀 Shuffle Order</button>
    <audio id="clickSfx"></audio>
  </header>

  <details open>
    <summary>🎛️ Main Controls</summary>
    <div class="row">
      <label>Pixel Size <input id="cell" type="range" min="2" max="128" value="24"></label>
      <label>RGB Split <input id="rgb" type="range" min="0" max="100" value="35"></label>
      <label>Speed <input id="speed" type="range" min="0" max="100" value="50"></label>
    </div>
  </details>

  <details open>
    <summary>🧩 Effects</summary>
    <div class="row">
      <label>Distortion <input id="strength" type="range" min="0" max="100" value="40"></label>
      <label><input id="fx_trail" type="checkbox" checked> Motion Trail</label>
      <label><input id="fx_vhs" type="checkbox" checked> VHS</label>
      <label><input id="fx_cpunk" type="checkbox"> Cyberpunk</label>
      <label><input id="fx_invert" type="checkbox"> Invert</label>
      <label><input id="fx_binary" type="checkbox"> 0101 Filter</label>
      <label><input id="fx_text" type="checkbox"> Text Popups</label>
      <label><input id="fx_blocks" type="checkbox"> Glitch Blocks</label>
      <label><input id="fx_leak" type="checkbox"> Light Leaks</label>
      <label><input id="fx_tape" type="checkbox"> Tape Roll</label>
      <label><input id="fx_psort" type="checkbox"> Pixel Sort</label>
      <label>Text Duration (ms) <input id="text_ms" type="number" min="200" step="100" value="1400"></label>
      <label>Monochrome <input id="fx_mono" type="checkbox"><input id="mono_a" type="color" value="#000000"><input id="mono_b" type="color" value="#ffffff"></label>
    </div>
  </details>

  <canvas id="gl"></canvas>
  <video id="vid" autoplay playsinline muted style="display:none"></video>

  <details>
    <summary>🧰 Pipeline</summary>
    <div id="orderPanel">
      <h3>Pipeline Order</h3>
      <div id="orderList"></div>
      <button id="btnShuffle2" class="btn sfx">🔀 Shuffle</button>
    </div>
  </details>

  <div id="status"></div>
  <script src="./lab.js"></script>
</body>
</html>
